<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin - Brainy Bites GH</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>body{background:#f8f9fa} .order-card{border-left:5px solid #ff7f00}</style>
</head><body>
<div class="container py-4">
<h2>🧠 Brainy Bites - Admin (CLOUD LIVE)</h2>
<p>Firebase Spark FREE - Real orders</p>
<div class="row"><div class="col-4"><div class="card p-3"><h6>Total Orders</h6><h3 id="totalOrders">0</h3></div></div>
<div class="col-4"><div class="card p-3"><h6>Pending</h6><h3 id="pendingOrders">0</h3></div></div>
<div class="col-4"><div class="card p-3"><h6>Revenue</h6><h3 id="rev">GHS 0</h3></div></div></div>
<hr><h4>Live Orders (auto updates)</h4><div id="orders">Loading...</div><hr>
<h4>Products Stock Control</h4><div id="products" class="row g-2"></div>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, onSnapshot, doc, updateDoc, deleteDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyBQctfAB42sS7ZYaoQGhImjRRCurPif3Y",
  authDomain: "brainy-bites-gh.firebaseapp.com",
  projectId: "brainy-bites-gh",
  storageBucket: "brainy-bites-gh.firebasestorage.app",
  messagingSenderId: "1053621074064",
  appId: "1:1053621074064:web:cf2b3d4b0cda1db2c1d9ed",
  measurementId: "G-PG4N9T79TC"
};
const app=initializeApp(firebaseConfig);
const db=getFirestore(app);
onSnapshot(query(collection(db,"orders"),orderBy("createdAt","desc")), snap=>{
  const orders=snap.docs.map(d=>({id:d.id,...d.data()}));
  document.getElementById('totalOrders').innerText=orders.length;
  document.getElementById('pendingOrders').innerText=orders.filter(o=>o.status==='pending').length;
  document.getElementById('rev').innerText='GHS '+orders.reduce((s,o)=>s+(o.total||0),0);
  document.getElementById('orders').innerHTML=orders.map(o=>`
    <div class="card order-card p-3 mb-2">
      <b>${o.productName} x${o.quantity} - GHS ${o.total}</b><br>
      ${o.customerName} | ${o.phone} | ${o.location}<br>
      Status: <span class="badge bg-warning">${o.status}</span> | ${o.createdAt?.toDate?.()?.toLocaleString()||'just now'}
      <div class="mt-2">
        <button class="btn btn-sm btn-success" onclick="updateStatus('${o.id}','completed')">Done</button>
        <button class="btn btn-sm btn-danger" onclick="delOrder('${o.id}')">Delete</button>
        <a class="btn btn-sm btn-outline-success" target="_blank" href="https://wa.me/233${o.phone.replace(/^0/,'')}?text=Hi ${o.customerName}, Brainy Bites order received!">WhatsApp</a>
      </div>
    </div>`).join('') || '<p>No orders yet - test order from main site</p>';
});
onSnapshot(collection(db,"products"), snap=>{
  const prods=snap.docs.map(d=>({id:d.id,...d.data()}));
  document.getElementById('products').innerHTML=prods.map(p=>`
    <div class="col-md-4"><div class="card p-3">
      <h5>${p.name} - GHS ${p.price}</h5><p>Stock: ${p.stock}</p>
      <div class="input-group"><input id="stock-${p.id}" type="number" value="${p.stock}" class="form-control"><button class="btn btn-warning" onclick="upStock('${p.id}')">Update</button></div>
    </div></div>`).join('');
});
window.updateStatus=async(id,s)=>{ await updateDoc(doc(db,"orders",id),{status:s}); };
window.delOrder=async(id)=>{ if(confirm('Delete?')) await deleteDoc(doc(db,"orders",id)); };
window.upStock=async(id)=>{ const v=parseInt(document.getElementById('stock-'+id).value); await updateDoc(doc(db,"products",id),{stock:v}); alert('Stock updated'); };
</script></body></html>
