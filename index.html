<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Brainy Bites GH</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>body{background:#fff8f0} .hero{background:#ff7f00;color:#fff;padding:40px;text-align:center} .product-card{border-radius:15px;box-shadow:0 4px 12px rgba(0,0,0,.1)} .btn-order{background:#ff7f00;color:#fff;border-radius:20px}</style>
</head><body>
<div class="hero"><h1>🧠 Brainy Bites GH</h1><p>Healthy Crunchy Ghanaian Made - Now Cloud Powered!</p></div>
<div class="container my-4"><div id="products" class="row g-3">Loading...</div></div>
<div class="modal fade" id="orderModal" tabindex="-1"><div class="modal-dialog"><div class="modal-content">
<div class="modal-header"><h5 id="mTitle"></h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
<div class="modal-body">
<p>Price: GHS <span id="mPrice"></span> | Stock: <span id="mStock"></span></p>
<input id="custName" class="form-control mb-2" placeholder="Your Name">
<input id="custPhone" class="form-control mb-2" placeholder="Phone e.g. 055...">
<input id="custLocation" class="form-control mb-2" placeholder="Location e.g. Accra">
<input id="orderQty" type="number" min="1" value="1" class="form-control mb-2">
<p>Total: GHS <b id="mTotal">0</b></p>
</div>
<div class="modal-footer"><button id="btnPlaceOrder" class="btn btn-order w-100">Place Order - Pay on Delivery</button></div>
</div></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyBQctfAB42sS7ZYaoQGhImjRRCurPif3Y",
  authDomain: "brainy-bites-gh.firebaseapp.com",
  projectId: "brainy-bites-gh",
  storageBucket: "brainy-bites-gh.firebasestorage.app",
  messagingSenderId: "1053621074064",
  appId: "1:1053621074064:web:cf2b3d4b0cda1db2c1d9ed",
  measurementId: "G-PG4N9T79TC"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
let products = []; let currentProduct = null;
async function loadProducts(){
  const snap = await getDocs(collection(db,"products"));
  if(snap.empty){
    const defaults = [
      {name:"Peanut Brittle",price:15,stock:50,desc:"Crunchy peanut snack",img:"🥜"},
      {name:"Coconut Chips",price:12,stock:40,desc:"Toasted coconut",img:"🥥"},
      {name:"Tigernut Mix",price:20,stock:30,desc:"Healthy tigernut",img:"🌰"}
    ];
    for(let p of defaults) await addDoc(collection(db,"products"),p);
    return loadProducts();
  }
  products = snap.docs.map(d=>({id:d.id,...d.data()}));
  render();
  onSnapshot(collection(db,"products"), s=>{ products=s.docs.map(d=>({id:d.id,...d.data()})); render(); });
}
function render(){
  document.getElementById('products').innerHTML = products.map(p=>`
    <div class="col-md-4"><div class="card product-card p-3 text-center">
      <h1>${p.img||'🍪'}</h1><h5>${p.name}</h5><p>${p.desc||''}</p>
      <h6>GHS ${p.price}</h6><small>${p.stock} left</small><br>
      <button class="btn btn-order mt-2" onclick="openOrder('${p.id}')" ${p.stock<=0?'disabled':''}>${p.stock<=0?'Sold Out':'Order Now'}</button>
    </div></div>`).join('');
}
window.openOrder = (id)=>{
  currentProduct = products.find(x=>x.id===id);
  document.getElementById('mTitle').innerText=currentProduct.name;
  document.getElementById('mPrice').innerText=currentProduct.price;
  document.getElementById('mStock').innerText=currentProduct.stock;
  document.getElementById('orderQty').value=1;
  document.getElementById('orderQty').max=currentProduct.stock;
  updateTotal();
  new bootstrap.Modal(document.getElementById('orderModal')).show();
}
function updateTotal(){
  if(!currentProduct) return;
  let q = parseInt(document.getElementById('orderQty').value)||1;
  document.getElementById('mTotal').innerText = (q*currentProduct.price).toFixed(2);
}
document.getElementById('orderQty').addEventListener('input',updateTotal);
document.getElementById('btnPlaceOrder').onclick = async ()=>{
  const name=document.getElementById('custName').value.trim();
  const phone=document.getElementById('custPhone').value.trim();
  const loc=document.getElementById('custLocation').value.trim();
  const qty=parseInt(document.getElementById('orderQty').value);
  if(!name||!phone) return alert('Enter name and phone');
  if(qty<1||qty>currentProduct.stock) return alert('Invalid qty');
  const btn=document.getElementById('btnPlaceOrder'); btn.disabled=true; btn.innerText='Placing...';
  try{
    await addDoc(collection(db,"orders"),{
      productId: currentProduct.id, productName: currentProduct.name, price: currentProduct.price,
      quantity: qty, total: qty*currentProduct.price, customerName: name, phone: phone, location: loc,
      status: "pending", createdAt: serverTimestamp()
    });
    await updateDoc(doc(db,"products",currentProduct.id),{stock: currentProduct.stock - qty});
    alert('✅ Order saved to CLOUD! We will call you.');
    bootstrap.Modal.getInstance(document.getElementById('orderModal')).hide();
  }catch(e){ alert('Error: '+e.message); }
  btn.disabled=false; btn.innerText='Place Order - Pay on Delivery';
};
loadProducts();
</script></body></html>
